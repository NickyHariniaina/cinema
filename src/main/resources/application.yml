spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinema}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:tellmeyourname}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
jwt:
  secret: ${JWT_SECRET:change-this-minimal-dev-secret-key-32bytes-min}
  expiration-ms: 3600000
